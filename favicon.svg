<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Tadeo">
  <!-- Letra T -->
  <g fill="#16244C">
    <rect x="28" y="11" width="24" height="6.5" rx="2"/>
    <rect x="36.5" y="11" width="7" height="37" rx="2"/>
  </g>

  <!-- Puntos dispersos (el "caos" del TDAH) -->
  <g>
    <circle cx="7"  cy="28" r="2.5" fill="#16244C"/>
    <circle cx="12" cy="22" r="2.3" fill="#16244C"/>
    <circle cx="11" cy="35" r="2.3" fill="#FB7185"/>
    <circle cx="16" cy="29" r="2.3" fill="#14B8A6"/>
    <circle cx="15" cy="42" r="2.5" fill="#16244C"/>
    <circle cx="20" cy="24" r="2"   fill="#14B8A6"/>
    <circle cx="21" cy="37" r="2.3" fill="#14B8A6"/>
    <circle cx="24" cy="31" r="2"   fill="#16244C"/>
    <circle cx="19" cy="46" r="2.3" fill="#16244C"/>
    <circle cx="25" cy="42" r="2"   fill="#FB7185"/>
  </g>

  <!-- Líneas que convergen (del caos al foco) -->
  <g fill="none" stroke="#14B8A6" stroke-width="2.6" stroke-linecap="round">
    <path d="M24 25 C 30 28, 32 30, 35 32"/>
    <path d="M23 44 C 30 40, 32 35, 35 32"/>
  </g>

  <!-- Fila de puntos hacia la salida + flecha (el "foco") -->
  <circle cx="47" cy="32" r="2.6" fill="#14B8A6"/>
  <circle cx="52" cy="32" r="2.6" fill="#FB7185"/>
  <path d="M55 27 L62 32 L55 37 Z" fill="#14B8A6"/>
</svg>
