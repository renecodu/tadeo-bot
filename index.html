<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=0">
<meta name="theme-color" content="#FFF8F0">
<title>Tadeo — Tu copiloto familiar TDAH</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
  :root {
    --color-deep: #0F2A3D;
    --color-teal: #14B8A6;
    --color-coral: #FB7185;
    --color-cream: #FFF8F0;
    --color-warm: #FEF3E8;
    --border: rgba(15,42,61,0.08);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  body {
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
    color: var(--color-deep);
    background: var(--color-cream);
    display: flex;
    flex-direction: column;
    height: 100dvh;
  }
  .serif { font-family: 'Instrument Serif', Georgia, serif; font-weight: 400; }

  /* Header */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 20px;
    background: white;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo {
    width: 36px; height: 36px; border-radius: 10px;
    background: var(--color-deep); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px;
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.2; }
  .brand-name { font-weight: 600; font-size: 15px; }
  .brand-status { font-size: 11px; color: var(--color-teal); display: flex; align-items: center; gap: 4px; }
  .brand-status::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--color-teal); display: inline-block;
  }
  .menu-btn {
    background: none; border: none; cursor: pointer;
    padding: 8px; border-radius: 8px;
    color: var(--color-deep); opacity: 0.5;
    font-size: 18px;
  }
  .menu-btn:hover { opacity: 1; background: var(--color-warm); }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    -webkit-overflow-scrolling: touch;
  }
  .chat-inner { max-width: 720px; margin: 0 auto; }

  /* Welcome */
  .welcome {
    text-align: center;
    padding: 32px 8px 24px;
  }
  .welcome-emoji {
    width: 64px; height: 64px; border-radius: 50%;
    background: var(--color-deep); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 26px;
    margin: 0 auto 20px;
  }
  .welcome h1 {
    font-size: 32px; line-height: 1.15; margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .welcome h1 .accent { color: var(--color-teal); }
  .welcome p {
    font-size: 16px; line-height: 1.6;
    color: rgba(15,42,61,0.7);
    margin: 0 auto 28px; max-width: 400px;
  }
  .suggestions {
    display: grid; gap: 10px;
    max-width: 520px; margin: 0 auto;
  }
  @media (min-width: 600px) {
    .suggestions { grid-template-columns: 1fr 1fr; }
  }
  .suggestion {
    background: white;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px 16px;
    text-align: left;
    cursor: pointer;
    font-family: inherit;
    font-size: 14px;
    color: var(--color-deep);
    line-height: 1.4;
    transition: all 0.15s ease;
    display: flex; align-items: flex-start; gap: 10px;
  }
  .suggestion:hover {
    background: var(--color-warm);
    border-color: rgba(15,42,61,0.2);
    transform: translateY(-1px);
  }
  .suggestion-icon {
    font-size: 18px; flex-shrink: 0;
  }
  .suggestion-text { flex: 1; }
  .suggestion-title { font-weight: 600; display: block; margin-bottom: 2px; }
  .suggestion-sub { font-size: 12px; color: rgba(15,42,61,0.6); }

  /* Messages */
  .msg {
    margin-bottom: 12px;
    display: flex;
    gap: 10px;
    animation: fadeIn 0.2s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { justify-content: flex-end; }
  .msg-bubble {
    max-width: 78%;
    padding: 12px 16px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.55;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-bubble {
    background: var(--color-deep);
    color: white;
    border-bottom-right-radius: 4px;
  }
  .msg.bot .msg-bubble {
    background: white;
    color: var(--color-deep);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--color-deep); color: white;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px;
    flex-shrink: 0;
    align-self: flex-end;
  }

  /* Markdown styles inside bubble */
  .msg-bubble p { margin: 0 0 8px; }
  .msg-bubble p:last-child { margin-bottom: 0; }
  .msg-bubble strong { font-weight: 600; }
  .msg-bubble em { font-style: italic; }
  .msg-bubble ul, .msg-bubble ol { margin: 6px 0; padding-left: 22px; }
  .msg-bubble li { margin: 3px 0; }
  .msg-bubble a {
    color: var(--color-teal);
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  /* Typing indicator */
  .typing {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 6px 0;
  }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: rgba(15,42,61,0.4);
    animation: bounce 1.3s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* Input */
  .input-area {
    background: white;
    border-top: 1px solid var(--border);
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .input-row {
    max-width: 720px; margin: 0 auto;
    display: flex; align-items: flex-end; gap: 10px;
    background: var(--color-cream);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
    transition: border-color 0.15s ease;
  }
  .input-row:focus-within {
    border-color: var(--color-teal);
  }
  textarea#input {
    flex: 1;
    border: none; background: transparent;
    resize: none; outline: none;
    font-family: inherit; font-size: 16px;
    color: var(--color-deep);
    padding: 10px 0;
    max-height: 140px;
    line-height: 1.4;
  }
  textarea#input::placeholder {
    color: rgba(15,42,61,0.4);
  }
  .send-btn {
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--color-deep); color: white;
    border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s ease;
  }
  .send-btn:disabled {
    background: rgba(15,42,61,0.2);
    cursor: not-allowed;
  }
  .send-btn:not(:disabled):hover { background: #1A3A52; }
  .input-hint {
    text-align: center;
    font-size: 11px;
    color: rgba(15,42,61,0.4);
    margin-top: 8px;
  }

  /* Reset button */
  .reset-link {
    background: none; border: none; cursor: pointer;
    color: rgba(15,42,61,0.4);
    font-family: inherit; font-size: 12px;
    padding: 4px 8px; border-radius: 6px;
  }
  .reset-link:hover { color: var(--color-deep); background: var(--color-warm); }
</style>
</head>

<body>

<header>
  <div class="brand">
    <div class="brand-logo">T</div>
    <div class="brand-text">
      <div class="brand-name">Tadeo</div>
      <div class="brand-status">En línea</div>
    </div>
  </div>
  <button class="reset-link" onclick="resetChat()" title="Empezar de nuevo">Nueva conversación</button>
</header>

<div class="chat-area" id="chatArea">
  <div class="chat-inner" id="chatInner">

    <!-- Welcome (se oculta cuando hay mensajes) -->
    <div class="welcome" id="welcome">
      <div class="welcome-emoji">T</div>
      <h1>Hola. Soy <span class="accent serif italic">Tadeo</span>.<br>¿Qué está pasando hoy?</h1>
      <p>Estoy aquí para acompañarte en crisis, rutinas, colegio o lo que necesites. Sin culpa, sin juicios.</p>

      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion('Mi hijo está en una crisis ahora mismo, no sé qué hacer. Ayúdame paso a paso.')">
          <span class="suggestion-icon">🆘</span>
          <span class="suggestion-text">
            <span class="suggestion-title">Estoy en una crisis</span>
            <span class="suggestion-sub">Necesito ayuda ahora</span>
          </span>
        </button>
        <button class="suggestion" onclick="sendSuggestion('Me llamaron del colegio por mi hijo. Ayúdame a responder y a manejar la situación.')">
          <span class="suggestion-icon">🏫</span>
          <span class="suggestion-text">
            <span class="suggestion-title">Tema con el colegio</span>
            <span class="suggestion-sub">Mensajes y reuniones</span>
          </span>
        </button>
        <button class="suggestion" onclick="sendSuggestion('Necesito una rutina simple para las mañanas. Cuéntame qué edad tiene el niño y diseñémosla.')">
          <span class="suggestion-icon">⏰</span>
          <span class="suggestion-text">
            <span class="suggestion-title">Crear una rutina</span>
            <span class="suggestion-sub">Mañanas, tareas, sueño</span>
          </span>
        </button>
        <button class="suggestion" onclick="sendSuggestion('Tengo dudas sobre el TDAH y quiero entender mejor a mi hijo. Empecemos por lo básico.')">
          <span class="suggestion-icon">📚</span>
          <span class="suggestion-text">
            <span class="suggestion-title">Entender el TDAH</span>
            <span class="suggestion-sub">Sin jerga ni culpa</span>
          </span>
        </button>
      </div>
    </div>

    <!-- aquí se inyectan los mensajes -->
  </div>
</div>

<div class="input-area">
  <form class="input-row" id="form" onsubmit="return false;">
    <textarea id="input" placeholder="Cuéntame qué está pasando…" rows="1" autocomplete="off"></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </form>
  <div class="input-hint">Tadeo no reemplaza atención profesional.</div>
</div>

<script>
const STORAGE_KEY = 'tadeo_messages';
const API_URL = '/api/chat';

let messages = [];
const chatInner = document.getElementById('chatInner');
const welcome = document.getElementById('welcome');
const input = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const form = document.getElementById('form');
const chatArea = document.getElementById('chatArea');

// Cargar mensajes guardados (sesión actual)
try {
  const saved = sessionStorage.getItem(STORAGE_KEY);
  if (saved) {
    messages = JSON.parse(saved);
    if (messages.length > 0) {
      welcome.style.display = 'none';
      messages.forEach(m => renderMessage(m.role, m.content));
      scrollToBottom();
    }
  }
} catch(e) {}

// Markdown muy simple
function renderMarkdown(text) {
  return text
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    .split(/\n\n+/).map(p => '<p>' + p.replace(/\n/g, '<br>') + '</p>').join('');
}

function renderMessage(role, content) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'assistant') div.classList.replace('assistant', 'bot');
  if (role === 'bot') div.className = 'msg bot';

  if (role === 'user') {
    div.innerHTML = `<div class="msg-bubble">${content.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>`;
  } else {
    div.innerHTML = `<div class="msg-avatar">T</div><div class="msg-bubble">${renderMarkdown(content)}</div>`;
  }
  chatInner.appendChild(div);
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'msg bot';
  div.id = 'typingMsg';
  div.innerHTML = `<div class="msg-avatar">T</div><div class="msg-bubble"><div class="typing"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>`;
  chatInner.appendChild(div);
  scrollToBottom();
}

function hideTyping() {
  const t = document.getElementById('typingMsg');
  if (t) t.remove();
}

function scrollToBottom() {
  setTimeout(() => {
    chatArea.scrollTop = chatArea.scrollHeight;
  }, 50);
}

function saveMessages() {
  try { sessionStorage.setItem(STORAGE_KEY, JSON.stringify(messages)); } catch(e) {}
}

async function sendMessage(text) {
  if (!text.trim()) return;

  welcome.style.display = 'none';

  // user message
  messages.push({ role: 'user', content: text });
  renderMessage('user', text);
  saveMessages();
  scrollToBottom();

  // disable input
  input.value = '';
  input.style.height = 'auto';
  input.disabled = true;
  sendBtn.disabled = true;

  showTyping();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages })
    });

    const data = await res.json();
    hideTyping();

    if (data.content && data.content[0]?.text) {
      const reply = data.content[0].text;
      messages.push({ role: 'assistant', content: reply });
      renderMessage('bot', reply);
      saveMessages();
    } else {
      renderMessage('bot', 'Tuve un problema al responderte. ¿Puedes intentar de nuevo?');
    }
  } catch (err) {
    hideTyping();
    renderMessage('bot', 'No pude conectarme. Revisa tu conexión y vuelve a intentar.');
  } finally {
    input.disabled = false;
    sendBtn.disabled = false;
    input.focus();
    scrollToBottom();
  }
}

function sendSuggestion(text) {
  sendMessage(text);
}

function resetChat() {
  if (messages.length === 0 || confirm('¿Empezar una nueva conversación? Se va a perder lo actual.')) {
    messages = [];
    sessionStorage.removeItem(STORAGE_KEY);
    chatInner.querySelectorAll('.msg').forEach(m => m.remove());
    welcome.style.display = '';
  }
}

// Auto-resize textarea
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 140) + 'px';
});

// Enter para enviar (Shift+Enter para nueva línea)
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(input.value);
  }
});

form.addEventListener('submit', () => sendMessage(input.value));

// Focus al cargar
setTimeout(() => input.focus(), 300);
</script>

</body>
</html>
